name: Deployment

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build artifacts
        run: |
          npm ci
          npm run build
      - name: Deploy to Staging/Production
        run: |
          echo "Deploying containerized API and static frontend assets"
