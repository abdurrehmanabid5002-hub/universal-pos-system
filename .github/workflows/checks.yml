name: Checks & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: universal_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://pos_user:change_me@localhost:5432/universal_pos
        run: npm run db:migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql://pos_user:change_me@localhost:5432/universal_pos
        run: npm test
